spring:
  application:
    name: FoodTruth Backend

  # MySQL datasource and JPA will be enabled when the database is provisioned.
  # DataSourceAutoConfiguration and HibernateJpaAutoConfiguration are excluded
  # in FoodTruthApplication.java until database features are implemented.

server:
  port: 8080

# Anthropic API configuration — the key is read from the ANTHROPIC_API_KEY
# environment variable and never exposed to the frontend.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  api-url: https://api.anthropic.com/v1/messages
  api-version: 2023-06-01
  model: claude-sonnet-4-20250514
  max-tokens: 1800

# Gemini API configuration — the key is read from the GEMINI_API_KEY
# environment variable and never exposed to the frontend.
gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-2.0-flash
  max-output-tokens: 1800
  temperature: 0.7
